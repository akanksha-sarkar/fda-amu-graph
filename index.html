<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/styles/vis-network.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --border:#2a333f;
    --fg:#e6edf3; --muted:#9aa7b4; --accent:#6fb3ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  /* ---- gate ---- */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
    justify-content:center;z-index:50}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:28px 26px;width:min(92vw,360px)}
  .card h1{font-size:17px;margin:0 0 4px} .card p{color:var(--muted);font-size:12.5px;margin:0 0 16px}
  .card label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .card input{width:100%;background:var(--panel2);border:1px solid var(--border);
    border-radius:8px;color:var(--fg);padding:9px 11px;font-size:14px}
  .card button{width:100%;margin-top:16px;background:var(--accent);color:#06121f;border:0;
    border-radius:8px;padding:10px;font-weight:600;font-size:14px;cursor:pointer}
  .err{color:#ff7a7a;font-size:12.5px;min-height:16px;margin-top:8px}
  /* ---- app ---- */
  #app{display:none;height:100%;flex-direction:column}
  header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;
    gap:16px;align-items:center;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:650}
  .stats{color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
  .stats b{color:var(--fg);font-weight:600}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .controls input[type=search]{background:var(--panel2);border:1px solid var(--border);
    border-radius:7px;color:var(--fg);padding:6px 10px;font-size:12.5px;min-width:180px}
  main{flex:1;position:relative;min-height:0}
  #net{position:absolute;inset:0}
  #legend{position:absolute;top:12px;left:12px;background:rgba(22,27,34,.92);
    border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;
    max-width:210px;backdrop-filter:blur(3px)}
  #legend .lg{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;user-select:none}
  #legend .lg.off{opacity:.38}
  #legend .dot{width:11px;height:11px;border-radius:50%;flex:none}
  #legend .cnt{margin-left:auto;color:var(--muted)}
  #legend .hint{color:var(--muted);font-size:11px;margin-top:6px;border-top:1px solid var(--border);padding-top:6px}
  #info{position:absolute;bottom:12px;left:12px;background:rgba(22,27,34,.92);
    border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12.5px;
    max-width:320px;display:none;backdrop-filter:blur(3px)}
  #info b{color:var(--accent)}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);background:var(--bg);z-index:5}
  .spin{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:s 1s linear infinite;margin-right:10px}
  @keyframes s{to{transform:rotate(360deg)}}
  .btn{background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--fg);
    padding:6px 10px;font-size:12.5px;cursor:pointer}
</style>
</head>
<body>
<div id="gate">
  <form class="card" id="gateForm">
    <h1>🐾 FDA AMU Knowledge Graph</h1>
    <p>This page is restricted. Enter the credentials you were given.</p>
    <label>Username</label>
    <input id="u" autocomplete="username" autocapitalize="none" autofocus>
    <label>Password</label>
    <input id="p" type="password" autocomplete="current-password">
    <button type="submit">View graph</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app">
  <header>
    <h1>🐾 FDA AMU Knowledge Graph</h1>
    <div class="stats" id="stats"></div>
    <div class="controls">
      <input type="search" id="search" placeholder="Search a node (label)…">
      <button class="btn" id="fit">Fit</button>
      <button class="btn" id="physics">Freeze</button>
    </div>
  </header>
  <main>
    <div id="net"></div>
    <div id="legend"></div>
    <div id="info"></div>
    <div id="loading"><span class="spin"></span>Laying out 1,146 nodes…</div>
  </main>
</div>

const COLORS = {"patient": "#6fb3ff", "species": "#9aa7b4", "drug": "#b98cff", "antimicrobial": "#ff7a7a", "drug_class": "#ffb86c", "problem": "#5ad6a8", "infection": "#f1d16a"};
const TYPE_ORDER = ["patient", "antimicrobial", "drug", "drug_class", "problem", "infection", "species"];
const VIS_SRC = "https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js";

async function sha256(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function show(){ document.getElementById("gate").style.display="none";
  const a=document.getElementById("app"); a.style.display="flex"; boot(); }

// already unlocked this session?
try{ if(sessionStorage.getItem("amu-graph-ok")==="1") show(); }catch(e){}

document.getElementById("gateForm").addEventListener("submit", async (ev)=>{
  ev.preventDefault();
  const u=document.getElementById("u").value.trim();
  const p=document.getElementById("p").value;
  const h=await sha256(u+"\n"+p);
  if(h===CRED_HASH){ try{sessionStorage.setItem("amu-graph-ok","1");}catch(e){} show(); }
  else { document.getElementById("err").textContent="Incorrect username or password."; }
});

let NET=null, physicsOn=true;
function loadVis(){ return new Promise((res,rej)=>{
  const s=document.createElement("script"); s.src=VIS_SRC; s.onload=res; s.onerror=rej;
  document.head.appendChild(s);
}); }

async function boot(){
  if(NET) return;
  const graph = JSON.parse(document.getElementById("graphdata").textContent);
  const meta  = JSON.parse(document.getElementById("metadata").textContent);

  // header stats
  document.getElementById("stats").innerHTML =
    `<span><b>${meta.patients.total}</b> patients</span>`+
    `<span><b>${graph.nodes.length}</b> nodes</span>`+
    `<span><b>${graph.edges.length}</b> edges</span>`+
    `<span><b>${meta.antimicrobials.distinct}</b> antimicrobials</span>`;

  // legend + counts
  const counts={}; graph.nodes.forEach(n=>counts[n.group]=(counts[n.group]||0)+1);
  const hidden=new Set();
  const legend=document.getElementById("legend");
  legend.innerHTML = TYPE_ORDER.filter(t=>counts[t]).map(t=>
    `<div class="lg" data-t="${t}"><span class="dot" style="background:${COLORS[t]}"></span>`+
    `<span>${t}</span><span class="cnt">${counts[t]}</span></div>`).join("")+
    `<div class="hint">Click a type to show/hide · click a node for details</div>`;

  await loadVis();
  document.getElementById("loading").querySelector("span:last-child")?.remove?.();

  const nodes=new vis.DataSet(graph.nodes.map(n=>({...n, color:COLORS[n.group]||"#888"})));
  const edges=new vis.DataSet(graph.edges.map((e,i)=>({id:i, ...e, arrows:"to"})));
  const container=document.getElementById("net");
  const options={
    nodes:{shape:"dot", scaling:{min:6,max:34},
      font:{color:"#cbd5e1",size:11,strokeWidth:3,strokeColor:"#0e1116"},
      borderWidth:1, color:{border:"#0e1116"}},
    edges:{color:{color:"#394350",highlight:"#6fb3ff",opacity:0.55},
      width:0.4, smooth:false, arrows:{to:{scaleFactor:0.35}}},
    physics:{stabilization:{iterations:160, updateInterval:25},
      barnesHut:{gravitationalConstant:-7000, springLength:110, springConstant:0.02,
        damping:0.5, avoidOverlap:0.1}, minVelocity:1.2},
    interaction:{hover:true, tooltipDelay:120, hideEdgesOnDrag:true, navigationButtons:false},
  };
  NET=new vis.Network(container,{nodes,edges},options);

  NET.on("stabilizationIterationsDone", ()=>{
    document.getElementById("loading").style.display="none";
    NET.setOptions({physics:false}); physicsOn=false;
    document.getElementById("physics").textContent="Unfreeze";
  });
  // safety: hide loader after a few s even if stabilization is slow
  setTimeout(()=>{document.getElementById("loading").style.display="none";}, 9000);

  // node click -> info + neighbor highlight
  const info=document.getElementById("info");
  NET.on("click", (params)=>{
    if(params.nodes.length){
      const id=params.nodes[0]; const n=nodes.get(id);
      const nbrs=NET.getConnectedNodes(id);
      info.style.display="block";
      info.innerHTML=`<b>${n.label}</b><br>type: ${n.group} · ${nbrs.length} connections`+
        `<br><span style="color:var(--muted)">double-click background to reset view</span>`;
      NET.selectNodes([id]);
    } else { info.style.display="none"; NET.unselectAll(); }
  });
  NET.on("doubleClick", ()=>{ NET.fit({animation:true}); info.style.display="none"; });

  // legend toggles
  legend.querySelectorAll(".lg").forEach(el=>{
    el.addEventListener("click", ()=>{
      const t=el.dataset.t; el.classList.toggle("off");
      const hide=el.classList.contains("off");
      const upd=graph.nodes.filter(n=>n.group===t).map(n=>({id:n.id, hidden:hide}));
      nodes.update(upd);
    });
  });

  // search
  document.getElementById("search").addEventListener("keydown",(e)=>{
    if(e.key!=="Enter") return;
    const q=e.target.value.trim().toLowerCase(); if(!q) return;
    const hit=graph.nodes.find(n=>String(n.label).toLowerCase().includes(q));
    if(hit){ NET.selectNodes([hit.id]); NET.focus(hit.id,{scale:1.1,animation:true});
      const n=nodes.get(hit.id);
      info.style.display="block";
      info.innerHTML=`<b>${n.label}</b><br>type: ${n.group}`;
    } else { info.style.display="block"; info.textContent="No node matches “"+q+"”."; }
  });
  document.getElementById("fit").addEventListener("click",()=>NET.fit({animation:true}));
  document.getElementById("physics").addEventListener("click",(e)=>{
    physicsOn=!physicsOn; NET.setOptions({physics:physicsOn});
    e.target.textContent=physicsOn?"Freeze":"Unfreeze";
  });
}
</script>
</body>
</html>
